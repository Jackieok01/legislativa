<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión — Gestión Legislativa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #1a1d23; min-height: 100vh; display:flex; align-items:center; }
    </style>
</head>
<body>
<div class="container" style="max-width:400px">
    <div class="text-center mb-4">
        <i class="bi bi-building-fill-check text-warning fs-1"></i>
        <h4 class="text-white mt-2 mb-0">Gestión Legislativa</h4>
        <p class="text-secondary small">Sistema de gestión del bloque</p>
    </div>

    <div class="card shadow border-0">
        <div class="card-body p-4">
            <h5 class="mb-4">Iniciar sesión</h5>

            {% with msgs = get_flashed_messages(with_categories=true) %}
                {% if msgs %}{% for cat, m in msgs %}
                <div class="alert alert-{{ cat }} py-2">{{ m }}</div>
                {% endfor %}{% endif %}
            {% endwith %}

            <form method="POST" autocomplete="on">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input name="username" class="form-control" placeholder="usuario"
                               autocomplete="username" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input name="password" type="password" class="form-control"
                               placeholder="••••••••" autocomplete="current-password" required>
                    </div>
                </div>
                <button class="btn btn-primary w-100 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="/recuperar" class="text-muted small">
                    <i class="bi bi-key me-1"></i>¿Olvidaste tu contraseña?
                </a>
            </div>
        </div>
    </div>

    <p class="text-center text-secondary small mt-3">
        Acceso restringido al personal autorizado
    </p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
