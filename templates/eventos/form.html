{% extends "base.html" %}
{% block title %}Nuevo Evento{% endblock %}
{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
    <a href="/eventos" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
    <h4 class="mb-0">Nuevo Evento</h4>
</div>
<div class="card p-4" style="max-width:520px">
<form method="POST">
    <div class="mb-3">
        <label class="form-label">Título <span class="text-danger">*</span></label>
        <input name="titulo" class="form-control" placeholder="Ej: Sesión Ordinaria N° 14" required>
    </div>
    <div class="row g-3 mb-3">
        <div class="col-6">
            <label class="form-label">Tipo</label>
            <select name="tipo" class="form-select">
                {% for t in ['Sesion Plenaria','Reunion Comision','Reunion Bloque','Otra'] %}
                <option>{{ t }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-6">
            <label class="form-label">Estado</label>
            <select name="estado" class="form-select">
                {% for s in ['Programado','Realizado','Cancelado'] %}
                <option>{{ s }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Fecha y hora <span class="text-danger">*</span></label>
        <input name="fecha" type="datetime-local" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Comisión (opcional)</label>
        <select name="comision_id" class="form-select">
            <option value="">— Ninguna —</option>
            {% for c in comisiones %}
            <option value="{{ c.id }}">{{ c.nombre }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Agenda / descripción</label>
        <textarea name="agenda" class="form-control" rows="3" placeholder="Temas a tratar..."></textarea>
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-primary">Crear</button>
        <a href="/eventos" class="btn btn-outline-secondary">Cancelar</a>
    </div>
</form>
</div>
{% endblock %}
