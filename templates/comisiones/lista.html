{% extends "base.html" %}
{% block title %}Comisiones{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0">Comisiones</h4>
    <a href="/comisiones/nueva" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nueva</a>
</div>
<div class="row g-3">
{% for c in comisiones %}
<div class="col-md-4">
    <div class="card h-100">
        <div class="card-body">
            <div class="d-flex justify-content-between">
                <h6 class="card-title">{{ c.nombre }}</h6>
                <span class="badge bg-secondary small">{{ c.tipo }}</span>
            </div>
            <span class="badge bg-{{ 'success' if c.activa else 'secondary' }}">{{ 'Activa' if c.activa else 'Inactiva' }}</span>
        </div>
        <div class="card-footer bg-white">
            <a href="/comisiones/{{ c.id }}" class="btn btn-sm btn-outline-primary">Ver miembros</a>
        </div>
    </div>
</div>
{% else %}
<div class="col"><p class="text-muted">No hay comisiones. <a href="/comisiones/nueva">Crear una</a>.</p></div>
{% endfor %}
</div>
{% endblock %}
