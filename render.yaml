services:
  - type: web
    name: legislativa
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    preDeployCommand: python init_db.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: legislativa-db
          property: connectionString

databases:
  - name: legislativa-db
    databaseName: legislativa
    user: legislativa
    plan: free
